<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button
        *ngIf="showMenu"
        menu="main-menu"
      ></ion-menu-button>

      <ion-back-button
        *ngIf="showBack"
        [defaultHref]="defaultHref"
        text=""
      ></ion-back-button>
    </ion-buttons>

    <ion-title class="page-title">{{ title }}</ion-title>
  </ion-toolbar>
</ion-header>
