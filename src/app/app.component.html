<ion-app>
  <ion-menu
    contentId="main-content"
    menuId="main-menu"
    [swipeGesture]="false"
  >
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list>
        <ion-menu-toggle auto-hide="true">

          <ion-item
            *ngIf="isAuthenticated() && isAdmin()"
            button
            routerLink="/admin"
            routerDirection="root"
          >
            <ion-label>Administration</ion-label>
          </ion-item>


          <ion-item
            *ngIf="isAuthenticated() && isAdmin()"
            button
            routerLink="/admin/users"
            routerDirection="root"
          >
            <ion-label>Utilisateurs</ion-label>
          </ion-item>

          <ion-item
            *ngIf="isAuthenticated() && isAdmin()"
            button
            routerLink="/admin/movies"
            routerDirection="root"
          >
            <ion-label>Films</ion-label>
          </ion-item>


          <ion-item
            *ngIf="isAuthenticated() && isAdmin()"
            button
            routerLink="/admin/add-movie"
            routerDirection="root"
          >
            <ion-label> ajouter Films</ion-label>
          </ion-item>

          <ion-item
            *ngIf="isAuthenticated() && !isAdmin()"
            button
            routerLink="/home"
            routerDirection="root"
          >
            <ion-label>Accueil</ion-label>
          </ion-item>

          <ion-item
            button
            routerLink="/favorites"
            routerDirection="root"
            *ngIf="isAuthenticated() && !isAdmin()"
          >
            <ion-label>favorites</ion-label>
          </ion-item>

          <ion-item
            button
            routerLink="/match"
            routerDirection="root"
            *ngIf="isAuthenticated() && !isAdmin()"
          >
            <ion-label>Match</ion-label>
          </ion-item>


          <ion-item
            button
            routerLink="/settings"
            routerDirection="root"
          >
            <ion-label>Paramètres</ion-label>
          </ion-item>

          <ion-item
            button
            routerLink="/profile"
            routerDirection="root"
          >
            <ion-label>profile</ion-label>
          </ion-item>

          <ion-item
            *ngIf="!isAuthenticated()"
            button
            routerLink="/login"
            routerDirection="root"
          >
            <ion-label>Connexion</ion-label>
          </ion-item>

          <ion-item
            *ngIf="isAuthenticated()"
            button
            (click)="logout()"
          >
            <ion-label>Déconnexion</ion-label>
          </ion-item>

        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
